<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 원소 운세</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>오늘의 원소 운세</h1>
      <p class="subtitle">정보를 입력하고 원소를 선택하면 오늘의 운세를 알려드려요</p>
    </header>

    <main>
      <section class="card" id="form-card">
        <form id="fortune-form">
          <div class="field">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required />
          </div>

          <div class="field">
            <label for="birthday">생일</label>
            <input type="date" id="birthday" name="birthday" required />
          </div>

          <div class="field">
            <label>성별</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="gender" value="여성" required />
                <span>여성</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="gender" value="남성" />
                <span>남성</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="gender" value="기타" />
                <span>기타</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label>오늘의 원소를 선택하세요</label>
            <div class="element-group" id="element-group">
              <button type="button" class="element-btn" data-element="물">
                <span class="element-icon">💧</span>
                <span>물</span>
              </button>
              <button type="button" class="element-btn" data-element="불">
                <span class="element-icon">🔥</span>
                <span>불</span>
              </button>
              <button type="button" class="element-btn" data-element="나무">
                <span class="element-icon">🌳</span>
                <span>나무</span>
              </button>
              <button type="button" class="element-btn" data-element="땅">
                <span class="element-icon">⛰️</span>
                <span>땅</span>
              </button>
              <button type="button" class="element-btn" data-element="바람">
                <span class="element-icon">🍃</span>
                <span>바람</span>
              </button>
            </div>
            <input type="hidden" id="element" name="element" required />
          </div>

          <button type="submit" class="submit-btn">운세 보기</button>
        </form>
      </section>

      <section class="card result-card" id="result-card" hidden>
        <div class="result-icon" id="result-icon"></div>
        <h2 id="result-title"></h2>
        <p id="result-greeting"></p>
        <p class="fortune-text" id="result-fortune"></p>
        <div class="lucky-info" id="lucky-info"></div>
        <button type="button" class="retry-btn" id="retry-btn">다시하기</button>
      </section>
    </main>

    <footer>
      <p>© 2026 오늘의 원소 운세. 재미로 보는 운세입니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
