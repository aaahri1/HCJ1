<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI 계산기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>BMI 계산기</h1>
    <p class="subtitle">키, 몸무게, 성별을 입력하면 BMI와 목표 체중을 계산해드려요.</p>

    <form id="bmi-form">
      <div class="field">
        <label for="height">키 (cm)</label>
        <input type="number" id="height" name="height" placeholder="예: 170" min="50" max="250" step="0.1" required />
      </div>

      <div class="field">
        <label for="weight">몸무게 (kg)</label>
        <input type="number" id="weight" name="weight" placeholder="예: 65" min="10" max="300" step="0.1" required />
      </div>

      <div class="field">
        <label>성별</label>
        <div class="gender-group">
          <label class="radio-label">
            <input type="radio" name="gender" value="male" checked />
            남성
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="female" />
            여성
          </label>
        </div>
      </div>

      <button type="submit">계산하기</button>
    </form>

    <section id="result" class="result" hidden>
      <div class="bmi-summary">
        <div class="bmi-value">
          <span id="bmi-number">0.0</span>
          <span id="bmi-category" class="badge">-</span>
        </div>
        <p class="bmi-desc">
          현재 체중 <strong id="current-weight">0</strong>kg /
          표준 체중 <strong id="standard-weight">0</strong>kg
        </p>
      </div>

      <table class="target-table">
        <thead>
          <tr>
            <th>표준체중 기준</th>
            <th>목표 체중</th>
            <th>감량/증량</th>
          </tr>
        </thead>
        <tbody id="target-body">
          <!-- rows filled by script.js -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
