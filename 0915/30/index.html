<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>구슬 대포 추첨기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>💣 구슬 대포 추첨기</h1>
      <p class="subtitle">이름을 입력하고 대포를 발사하세요. 장애물을 뚫고 <strong>가장 마지막에 착지하는 구슬</strong>이 당첨자입니다!</p>
    </header>

    <main class="layout">
      <!-- 왼쪽: 컨트롤 패널 -->
      <section class="panel controls-panel">
        <div id="setup-stage">
          <h2>참가자 입력</h2>
          <div class="input-row">
            <input id="name-input" type="text" placeholder="이름 입력 후 Enter (쉼표로 여러 명 가능)" autocomplete="off" />
            <button id="add-btn" class="btn btn-secondary">추가</button>
          </div>
          <div id="name-count" class="name-count">총 0명</div>
          <ul id="name-list" class="name-list"></ul>

          <div class="action-row">
            <button id="clear-btn" class="btn btn-ghost">전체 삭제</button>
            <button id="start-btn" class="btn btn-primary" disabled>🎯 추첨 시작</button>
          </div>
        </div>

        <div id="running-stage" class="hidden">
          <h2>진행 상황</h2>
          <p id="status-text" class="status-text">발사 준비 중...</p>
          <ol id="order-list" class="order-list"></ol>
          <div class="action-row">
            <button id="replay-btn" class="btn btn-secondary" disabled>🔄 같은 명단으로 다시</button>
            <button id="reset-btn" class="btn btn-ghost" disabled>✏️ 명단 다시 입력</button>
          </div>
        </div>
      </section>

      <!-- 오른쪽: 캔버스 스테이지 -->
      <section class="panel stage-panel">
        <div id="winner-banner" class="winner-banner hidden">
          <div class="winner-crown">👑</div>
          <div class="winner-label">당첨자</div>
          <div id="winner-name" class="winner-name">-</div>
        </div>
        <canvas id="stage" width="720" height="860"></canvas>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
