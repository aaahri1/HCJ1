<title>글자수 세기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #efece4;
    --ink: #24211d;
    --muted: #79746c;
    --border: #e0dcd2;
    --accent: #b23a2e;
    --accent-ink: #ffffff;
    --accent-soft: #f1dad4;
    --accent-soft-ink: #7a2a21;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1917;
      --surface: #242220;
      --surface-2: #2c2a26;
      --ink: #ede9e2;
      --muted: #a39c90;
      --border: #3a362f;
      --accent: #e2695a;
      --accent-ink: #201310;
      --accent-soft: #3a2622;
      --accent-soft-ink: #f2b8ac;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1b1917;
    --surface: #242220;
    --surface-2: #2c2a26;
    --ink: #ede9e2;
    --muted: #a39c90;
    --border: #3a362f;
    --accent: #e2695a;
    --accent-ink: #201310;
    --accent-soft: #3a2622;
    --accent-soft-ink: #f2b8ac;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    padding: 40px 20px 64px;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 38px);
    margin: 0;
    text-wrap: balance;
  }

  .lede {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 60ch;
    margin: 0;
  }

  .lede b {
    color: var(--ink);
    font-weight: 500;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    color: var(--muted);
  }

  #clear-btn {
    background: none;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  #clear-btn:hover { color: var(--accent); }
  #clear-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--ink);
  }

  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  @media (min-width: 480px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat.is-primary {
    background: var(--accent-soft);
    border-color: transparent;
  }

  .stat-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .stat.is-primary .stat-label { color: var(--accent-soft-ink); }

  .stat-value {
    font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 26px;
    line-height: 1;
  }

  .stat.is-primary .stat-value { color: var(--accent-soft-ink); }

  .stat-unit {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 2px;
  }

  .stat.is-primary .stat-unit { color: var(--accent-soft-ink); opacity: 0.75; }

  .rule {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .rule-mark {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }

  .rule code {
    font-family: "JetBrains Mono", monospace;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink);
    font-size: 12px;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
</style>

<main>
  <header>
    <span class="eyebrow">Text Length Utility</span>
    <h1>글자수 세기</h1>
    <p class="lede">
      아래에 텍스트를 입력하면 실시간으로 글자수와 byte 수를 계산합니다.
      <b>한글, 한자 등 완성형 문자는 2byte</b>, 영문·숫자·기호는 1byte로 계산해요.
    </p>
  </header>

  <div class="panel">
    <div class="field-label">
      <span>입력한 텍스트</span>
      <button id="clear-btn" type="button">지우기</button>
    </div>
    <textarea id="input" spellcheck="false">안녕하세요! 이 도구는 입력한 텍스트의 글자수와 byte 수를 세어줍니다.
자기소개서, 이름, 주소처럼 byte 제한이 있는 입력칸에 써보세요.</textarea>

    <div class="stats">
      <div class="stat is-primary">
        <span class="stat-label">전체 글자수</span>
        <span><span class="stat-value" id="stat-chars">0</span><span class="stat-unit">자</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">공백 제외</span>
        <span><span class="stat-value" id="stat-chars-nospace">0</span><span class="stat-unit">자</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">단어수</span>
        <span><span class="stat-value" id="stat-words">0</span><span class="stat-unit">개</span></span>
      </div>
      <div class="stat is-primary">
        <span class="stat-label">Byte 수</span>
        <span><span class="stat-value" id="stat-bytes">0</span><span class="stat-unit">byte</span></span>
      </div>
    </div>

    <div class="rule">
      <span class="rule-mark">※</span>
      <span>
        Byte 계산 규칙: 영문·숫자·공백·기호는 <code>1byte</code>,
        한글·한자·이모지 등 아스키(ASCII) 범위를 벗어나는 문자는 <code>2byte</code>로 계산합니다.
      </span>
    </div>
  </div>

  <footer>줄바꿈도 1글자로 계산됩니다 · 모든 계산은 브라우저에서만 이루어집니다</footer>
</main>

<script>
  const input = document.getElementById('input');
  const statChars = document.getElementById('stat-chars');
  const statCharsNoSpace = document.getElementById('stat-chars-nospace');
  const statWords = document.getElementById('stat-words');
  const statBytes = document.getElementById('stat-bytes');
  const clearBtn = document.getElementById('clear-btn');

  function countByteLength(text) {
    let bytes = 0;
    for (const ch of text) {
      const codePoint = ch.codePointAt(0);
      bytes += codePoint <= 0x7f ? 1 : 2;
    }
    return bytes;
  }

  function update() {
    const text = input.value;
    const chars = [...text].length;
    const noSpace = [...text.replace(/\s/g, '')].length;
    const words = text.trim().length === 0 ? 0 : text.trim().split(/\s+/).length;
    const bytes = countByteLength(text);

    statChars.textContent = chars.toLocaleString('ko-KR');
    statCharsNoSpace.textContent = noSpace.toLocaleString('ko-KR');
    statWords.textContent = words.toLocaleString('ko-KR');
    statBytes.textContent = bytes.toLocaleString('ko-KR');
  }

  input.addEventListener('input', update);
  clearBtn.addEventListener('click', () => {
    input.value = '';
    input.focus();
    update();
  });

  update();
</script>
